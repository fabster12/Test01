<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Urban Pollinator Garden Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='planner_style.css') }}">
    <style>
        .cover-image {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="page cover">
        {% if cover_image_url %}
            <img src="{{ cover_image_url }}" alt="Cover Image" class="cover-image">
        {% else %}
            <h1>The Urban Pollinator Garden Planner</h1>
        {% endif %}
    </div>
    {{ planner_content | safe }}
</body>
</html>
