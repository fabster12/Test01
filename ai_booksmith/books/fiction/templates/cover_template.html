<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cover - {{ project.title }}</title>
    <style>
        @page {
            size: 6in 9in;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            width: 6in;
            height: 9in;
            position: relative;
        }
        img.cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1.cover-title {
            position: absolute;
            top: 1in;
            left: 0.5in;
            right: 0.5in;
            color: white;
            text-align: center;
            font-family: 'Helvetica', sans-serif;
            font-size: 48pt;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <!-- For simplicity, we'll use a placeholder for the main cover art -->
    <!-- In a real implementation, we would generate a specific cover image. -->
    <img src="{{ project.chapters[0].images[0].url if project.chapters and project.chapters[0].images else 'https://placehold.co/600x900?text=Cover+Art' }}" class="cover-image" alt="Cover Art">
    <h1 class="cover-title">{{ project.title }}</h1>
</body>
</html>
