{% extends "base.html" %}

{% block title %}New Fiction Project - AI Booksmith{% endblock %}

{% block content %}
<h2>New Fiction Project</h2>
<p>Let's brainstorm some ideas for your next book. Fill out the form below to get started.</p>

<form action="{{ url_for('fiction.generate_ideas', project_id=project.id) }}" method="POST">
    <div class="form-group">
        <label for="genre">Genre</label>
        <button type="button" id="brainstorm-btn" class="btn btn-secondary btn-sm ml-2">Brainstorm Themes</button>
        <div id="suggestions-container" class="mt-2"></div>
        <input type="text" id="genre" name="genre" class="form-control" value="{{ project.genre or 'Science Fiction' }}" list="genre-suggestions" required>
        <datalist id="genre-suggestions">
            <option value="Science Fiction">
            <option value="Fantasy">
            <option value="Mystery">
            <option value="Thriller">
            <option value="Romance">
            <option value="Horror">
            <option value="Historical Fiction">
            <option value="Adventure">
            <option value="Children's">
            <option value="Comedy">
            <option value="Crime">
            <option value="Dystopian">
            <option value="Literary Fiction">
            <option value="Magical Realism">
            <option value="Paranormal">
            <option value="Steampunk">
            <option value="Cyberpunk">
            <option value="Urban Fantasy">
            <option value="Young Adult">
        </datalist>
    </div>
    <div class="form-check form-switch">
        <input type="checkbox" id="niche_switch" name="niche" class="form-check-input" {% if project.niche == 'on' %}checked{% endif %}>
        <label for="niche_switch" class="form-check-label">Make it Niche</label>
    </div>
    <div class="form-group">
        <label for="description">Brief Description or Theme</label>
        <textarea id="description" name="description" class="form-control" rows="3" required>{{ project.description or 'A generation ship, a long journey, a mystery.' }}</textarea>
    </div>
    <div class="form-group">
        <label for="word_count">Target Word Count</label>
        <input type="text" id="word_count" name="word_count" class="form-control" list="word_count_options" value="{{ project.word_count or '50000' }}" required>
        <datalist id="word_count_options">
            <option value="20000">Novella (20,000 words)</option>
            <option value="50000">Short Novel (50,000 words)</option>
            <option value="80000">Standard Novel (80,000 words)</option>
        </datalist>
    </div>
    <div class="form-group">
        <label for="language">Language</label>
        <select id="language" name="language" class="form-control">
            <option value="English" {% if project.language == 'English' %}selected{% endif %}>English</option>
            <option value="Dutch" {% if project.language == 'Dutch' %}selected{% endif %}>Dutch</option>
            <option value="German" {% if project.language == 'German' %}selected{% endif %}>German</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Generate Ideas</button>
</form>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('DEBUG: DOM content loaded. Initializing script.');

    const brainstormBtn = document.getElementById('brainstorm-btn');
    const suggestionsContainer = document.getElementById('suggestions-container');
    const genreInput = document.getElementById('genre');
    const descriptionInput = document.getElementById('description');

    if (brainstormBtn) {
        console.log('DEBUG: Brainstorm button element found:', brainstormBtn);
        brainstormBtn.addEventListener('click', function() {
        console.log('Brainstorm button clicked.');
        suggestionsContainer.innerHTML = '<p>Brainstorming for you...</p>';

        fetch("{{ url_for('fiction.brainstorm_themes') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            console.log('Received response from server:', response);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('Parsed JSON data:', data);
            suggestionsContainer.innerHTML = ''; // Clear loading message
            if (data.error) {
                console.error('Server returned an error:', data.error);
                suggestionsContainer.innerHTML = `<p class="text-danger">${data.error}</p>`;
                return;
            }
            if (data.suggestions && data.suggestions.length > 0) {
                const list = document.createElement('ul');
                list.className = 'list-group';
                data.suggestions.forEach(suggestion => {
                    const listItem = document.createElement('li');
                    listItem.className = 'list-group-item list-group-item-action';
                    listItem.style.cursor = 'pointer';
                    listItem.innerHTML = `<strong>${suggestion.genre}:</strong> ${suggestion.theme}`;
                    listItem.addEventListener('click', function() {
                        genreInput.value = suggestion.genre;
                        descriptionInput.value = suggestion.theme;
                        suggestionsContainer.innerHTML = ''; // Clear suggestions after selection
                    });
                    list.appendChild(listItem);
                });
                suggestionsContainer.appendChild(list);
            } else {
                suggestionsContainer.innerHTML = '<p>No suggestions were generated. Please try again.</p>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            suggestionsContainer.innerHTML = '<p class="text-danger">An error occurred while brainstorming.</p>';
        });
    } else {
        console.error('DEBUG: Brainstorm button element not found!');
    }
});
</script>
{% endblock %}
