{% extends "base.html" %}

{% block title %}New Fiction Project - AI Booksmith{% endblock %}

{% block content %}
<h2>New Fiction Project</h2>
<p>Let's brainstorm some ideas for your next book. Fill out the form below to get started.</p>

<form action="{{ url_for('fiction.generate_ideas') }}" method="POST">
    <div class="form-group">
        <label for="genre">Genre</label>
        <button type="button" id="brainstorm-btn" class="btn btn-secondary btn-sm ml-2">Brainstorm Themes</button>
        <div id="suggestions-container" class="mt-2"></div>
        <input type="text" id="genre" name="genre" class="form-control" value="{{ theme_data.title if theme_data else 'Science Fiction' }}" required>
    </div>
    <div class="form-group">
        <label for="description">Brief Description or Theme</label>
        <textarea id="description" name="description" class="form-control" rows="3" required>{{ theme_data.description if theme_data else 'A generation ship, a long journey, a mystery.' }}</textarea>
    </div>
    <div class="form-group">
        <label for="word_count">Target Word Count</label>
        <input type="text" id="word_count" name="word_count" class="form-control" list="word_count_options" value="50000" required>
        <datalist id="word_count_options">
            <option value="20000">Novella (20,000 words)</option>
            <option value="50000">Short Novel (50,000 words)</option>
            <option value="80000">Standard Novel (80,000 words)</option>
        </datalist>
    </div>
    <div class="form-group">
        <label for="language">Language</label>
        <select id="language" name="language" class="form-control">
            <option value="English">English</option>
            <option value="Dutch">Dutch</option>
            <option value="German">German</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Generate Ideas</button>
</form>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const brainstormBtn = document.getElementById('brainstorm-btn');
    const suggestionsContainer = document.getElementById('suggestions-container');
    const genreInput = document.getElementById('genre');
    const descriptionInput = document.getElementById('description');

    brainstormBtn.addEventListener('click', function() {
        suggestionsContainer.innerHTML = '<p>Brainstorming for you...</p>';

        fetch("{{ url_for('fiction.brainstorm_themes') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            suggestionsContainer.innerHTML = ''; // Clear loading message
            if (data.error) {
                suggestionsContainer.innerHTML = `<p class="text-danger">${data.error}</p>`;
                return;
            }
            if (data.suggestions && data.suggestions.length > 0) {
                const list = document.createElement('ul');
                list.className = 'list-group';
                data.suggestions.forEach(suggestion => {
                    const listItem = document.createElement('li');
                    listItem.className = 'list-group-item list-group-item-action';
                    listItem.style.cursor = 'pointer';
                    listItem.innerHTML = `<strong>${suggestion.genre}:</strong> ${suggestion.theme}`;
                    listItem.addEventListener('click', function() {
                        genreInput.value = suggestion.genre;
                        descriptionInput.value = suggestion.theme;
                        suggestionsContainer.innerHTML = ''; // Clear suggestions after selection
                    });
                    list.appendChild(listItem);
                });
                suggestionsContainer.appendChild(list);
            } else {
                suggestionsContainer.innerHTML = '<p>No suggestions were generated. Please try again.</p>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            suggestionsContainer.innerHTML = '<p class="text-danger">An error occurred while brainstorming.</p>';
        });
    });
});
</script>
{% endblock %}
