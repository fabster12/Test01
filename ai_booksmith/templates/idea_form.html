{% extends "base.html" %}

{% block title %}New Fiction Book - AI Booksmith{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Step 2: Describe Your Idea</h3>
                <p class="card-text text-center text-muted">Provide a genre, a description, and a language for your new fiction book.</p>

                <form action="{{ url_for('generate_ideas', book_type=book_type) }}" method="post" class="mt-4">
                    <div class="mb-3">
                        <label for="language" class="form-label">Book Language</label>
                        <select class="form-select" id="language" name="language" required>
                            <option value="English" selected>English</option>
                            <option value="Dutch">Dutch</option>
                            <option value="German">German</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="genre" class="form-label">Genre</label>
                        <input type="text" class="form-control" id="genre" name="genre" placeholder="e.g., Science Fiction, Cozy Mystery, Fantasy Adventure" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Brief Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="e.g., 'A story about a lost robot trying to find its way home in a futuristic city.' or 'A detective solves a murder in a quiet English village during winter.'" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="word_count" class="form-label">Target Word Count</label>
                        <input type="number" class="form-control" id="word_count" name="word_count" value="20000" step="1000" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Generate Ideas</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
