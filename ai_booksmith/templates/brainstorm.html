{% extends "base.html" %}

{% block title %}Brainstorm Themes - AI Booksmith{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Step 2: Brainstorm a Theme</h3>
                <p class="card-text text-center text-muted">Enter a broad topic or genre. The AI will suggest some specific themes for your {{ book_type }} book.</p>

                <form action="{{ url_for('generate_themes', book_type=book_type) }}" method="post" class="mt-4">
                    <div class="mb-3">
                        <label for="topic" class="form-label">Topic or Genre</label>
                        <input type="text" class="form-control" id="topic" name="topic" placeholder="e.g., 'Dragons', 'Victorian England', 'Mindfulness for Kids'" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="find_niche" name="find_niche" value="true">
                        <label class="form-check-label" for="find_niche">
                            Find Niche Ideas (Focus on low-competition areas)
                        </label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Brainstorm Themes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
