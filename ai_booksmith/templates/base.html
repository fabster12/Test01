<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Booksmith{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('index') }}" style="color: inherit; text-decoration: none;">AI Booksmith</a></h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Home</a></li>
                <li><a href="{{ url_for('fiction.fiction_dashboard') }}" class="{{ 'active' if 'fiction' in request.endpoint else '' }}">Fiction Books</a></li>
                <li><a href="{{ url_for('low_content.coloring_book_home') }}" class="{{ 'active' if 'low_content' in request.endpoint else '' }}">Coloring Books</a></li>
                <li><a href="{{ url_for('garden_planner.index') }}" class="{{ 'active' if 'garden_planner' in request.endpoint else '' }}">Garden Planner</a></li>
                <li><a href="{{ url_for('system_info') }}" class="{{ 'active' if request.endpoint == 'system_info' else '' }}">System</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container text-center">
            <p>&copy; 2024 AI Booksmith. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
